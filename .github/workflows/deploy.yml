name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: |
          npm ci --prefix client
          npm run build --prefix client

      - name: Validate backend
        run: |
          npm ci --prefix server
          node --check server/src/server.js

      - name: Prepare release
        run: |
          rm -rf release
          mkdir -p release
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='client/dist' --exclude='server/.env' ./ release/
          rm -rf release/client
          cp -a client/dist/. release/

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USERNAME@$SSH_HOST" \
            'sudo mkdir -p /var/www/portfolio && sudo chown -R "$USER":"$USER" /var/www/portfolio'
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='server/.env' \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22}" \
            release/ "$SSH_USERNAME@$SSH_HOST:/var/www/portfolio/"
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USERNAME@$SSH_HOST" <<'REMOTE'
          set -e
          cd /var/www/portfolio
          npm ci --omit=dev --prefix server
          pm2 startOrReload ecosystem.config.cjs --env production
          curl --fail --silent --show-error http://127.0.0.1:5000/api/health
          REMOTE