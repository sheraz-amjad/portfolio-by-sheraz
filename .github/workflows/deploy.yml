name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: |
          npm ci --prefix client
          npm run build --prefix client

      - name: Validate backend
        run: |
          npm ci --prefix server
          node --check server/src/server.js

      - name: Prepare release
        run: |
          rm -rf release
          mkdir -p release
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='client/dist' --exclude='server/.env' ./ release/
          rm -rf release/client
          cp -a client/dist/. release/

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_PRIVATE_KEY and SSH_HOST secrets must be configured"
            exit 1
          fi
          SSH_DIR="$RUNNER_TEMP/portfolio-ssh"
          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/deploy_key"
          chmod 600 "$SSH_DIR/deploy_key"
          if ! ssh-keyscan -T 10 -p "${SSH_PORT:-22}" -H "$SSH_HOST" > "$SSH_DIR/known_hosts"; then
            echo "::error::Unable to retrieve an SSH host key from $SSH_HOST"
            exit 1
          fi
          printf 'SSH_DIR=%s\n' "$SSH_DIR" >> "$GITHUB_ENV"

      - name: Deploy release
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USERNAME: ${{ secrets.EC2_USER }}
        run: |
          ssh -i "$SSH_DIR/deploy_key" -o UserKnownHostsFile="$SSH_DIR/known_hosts" -p "${SSH_PORT:-22}" "$SSH_USERNAME@$SSH_HOST" \
            'sudo mkdir -p /var/www/portfolio && sudo chown -R "$USER":"$USER" /var/www/portfolio'
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='server/.env' \
            -e "ssh -i $SSH_DIR/deploy_key -o UserKnownHostsFile=$SSH_DIR/known_hosts -p ${SSH_PORT:-22}" \
            release/ "$SSH_USERNAME@$SSH_HOST:/var/www/portfolio/"
          ssh -i "$SSH_DIR/deploy_key" -o UserKnownHostsFile="$SSH_DIR/known_hosts" -p "${SSH_PORT:-22}" "$SSH_USERNAME@$SSH_HOST" <<'REMOTE'
          set -e
          if ! command -v npm >/dev/null 2>&1; then
            curl --fail --silent --show-error https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi
          if ! command -v pm2 >/dev/null 2>&1; then
            sudo npm install --global pm2
          fi
          cd /var/www/portfolio
          npm ci --omit=dev --prefix server
          pm2 startOrReload ecosystem.config.cjs --env production

          echo "Waiting for app to become healthy..."
          for i in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:5000/api/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/15 failed, retrying in 2s..."
            sleep 2
          done

          echo "Health check failed after retries, dumping logs:"
          pm2 logs portfolio-api --lines 50 --nostream
          pm2 describe portfolio-api
          exit 1
          REMOTE