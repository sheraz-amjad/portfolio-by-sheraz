name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: |
          npm ci --prefix client
          npm run build --prefix client

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_PRIVATE_KEY and SSH_HOST secrets must be configured"
            exit 1
          fi
          SSH_DIR="$RUNNER_TEMP/portfolio-ssh"
          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/deploy_key"
          chmod 600 "$SSH_DIR/deploy_key"
          if ! ssh-keyscan -T 10 -p "${SSH_PORT:-22}" -H "$SSH_HOST" > "$SSH_DIR/known_hosts"; then
            echo "::error::Unable to retrieve an SSH host key from $SSH_HOST"
            exit 1
          fi
          printf 'SSH_DIR=%s\n' "$SSH_DIR" >> "$GITHUB_ENV"
          printf 'SSH_PORT=%s\n' "${SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Deploy static release to EC2
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USERNAME: ${{ secrets.EC2_USER }}
        run: |
          ssh -i "$SSH_DIR/deploy_key" -o UserKnownHostsFile="$SSH_DIR/known_hosts" -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" \
            'sudo mkdir -p /var/www/portfolio && sudo chown -R "$USER":"$USER" /var/www/portfolio'

          # Stop and remove legacy PM2 process if still running to free up memory
          ssh -i "$SSH_DIR/deploy_key" -o UserKnownHostsFile="$SSH_DIR/known_hosts" -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" \
            'pm2 delete portfolio-api || true'

          # Synchronize static built files to web root
          rsync -avz --delete \
            -e "ssh -i $SSH_DIR/deploy_key -o UserKnownHostsFile=$SSH_DIR/known_hosts -p $SSH_PORT" \
            client/dist/ "$SSH_USERNAME@$SSH_HOST:/var/www/portfolio/"

          # Reload Nginx web server
          ssh -i "$SSH_DIR/deploy_key" -o UserKnownHostsFile="$SSH_DIR/known_hosts" -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" \
            'sudo systemctl reload nginx || sudo service nginx reload'
