services:
  # Express.js REST API Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfolio-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=*
    networks:
      - portfolio-network

  # React + Vite Client (Served via Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: portfolio-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge